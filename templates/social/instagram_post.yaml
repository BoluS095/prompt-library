name: Instagram Post — Clean Product Feature
model: dall-e-3
category: social

prompt: >
  Professional social media post design, {product_description},
  centered composition, clean {background_style} background,
  modern minimalist aesthetic, Instagram square format,
  brand colors {colors}, high-end commercial quality

variables:
  product_description: "product and the main message to communicate"
  background_style: "plain, gradient, studio, or lifestyle treatment"
  colors: "brand colors or hex values"

settings:
  size: "1024x1024"
  quality: "hd"
  style: "natural"

notes: >
  Use the image as a visual base. Add final typography and precise
  brand copy in a design tool rather than relying on generated text.
